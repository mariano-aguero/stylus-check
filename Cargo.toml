[package]
name = "stylus-check"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Static security checks for Arbitrum Stylus contracts, written for the stylus-sdk rather than for Solidity"
repository = "https://github.com/mariano-aguero/stylus-check"
homepage = "https://github.com/mariano-aguero/stylus-check"
keywords = ["arbitrum", "stylus", "security", "linter", "static-analysis"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
exclude = ["tests/fixtures/**"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
proc-macro2 = { version = "1.0", features = ["span-locations"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syn = { version = "2.0", features = ["full", "visit", "extra-traits", "parsing"] }
toml = "0.8"
walkdir = "2.5"

[profile.release]
lto = true
codegen-units = 1
